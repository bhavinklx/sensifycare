openapi: 3.0.0
info:
  title: Sensify Care API
  version: 1.0.0
  description: API for sensify care operations
servers:
  - url: http://localhost
    description: Local server
  - url: https://www.sensifycare.com
    description: Production server
paths:
  /api/patient-signup:
    post:
      summary: Register a new patient
      description: Create a new patient record by providing name, email, mobile, and date of birth.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - mobile
                - dob
              properties:
                name:
                  type: string
                  example: "John Doe"
                email:
                  type: string
                  format: email
                  example: "john.doe@example.com"
                mobile:
                  type: string
                  example: "9876543210"
                dob:
                  type: string
                  format: date
                  example: "1990-05-15"
      responses:
        '200':
          description: Patient successfully registered
        '400':
          description: Invalid input parameters
  /api/patient-verify-otp:
    post:
      summary: Verify Patient OTP
      description: Verify the OTP sent to the patient's phone number.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - patient_phone
                - otp
              properties:
                patient_phone:
                  type: string
                  example: "9173905270"
                otp:
                  type: string
                  example: "729037"
      responses:
        '200':
          description: OTP verified successfully
        '400':
          description: Invalid OTP or input parameters
  /api/patient-send-otp:
    post:
      summary: Send Patient OTP
      description: Request an OTP to be sent to the patient's phone number.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - patient_phone
              properties:
                patient_phone:
                  type: string
                  example: "9173905270"
      responses:
        '200':
          description: OTP sent successfully
        '400':
          description: Invalid input parameters
  /api/patient-profile:
    get:
      summary: Get Patient Profile
      description: Retrieve the profile information for the authenticated patient.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful response
        '401':
          description: Unauthorized
  /api/patient-profile/update:
    post:
      summary: Update Patient Profile
      description: Update profile details for the authenticated patient, including optional image upload.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                  example: "John"
                last_name:
                  type: string
                  example: "Doe"
                email:
                  type: string
                  format: email
                  example: "john.doe@example.com"
                phone:
                  type: string
                  example: "9876543210"
                dob:
                  type: string
                  format: date
                  example: "1990-05-15"
                gender:
                  type: string
                  example: "Male"
                marital_status:
                  type: string
                  example: "Single"
                occupation:
                  type: string
                  example: "Software Engineer"
                blood_group:
                  type: string
                  example: "O+"
                blood_pressure:
                  type: string
                  example: "120/80"
                sugar_level:
                  type: string
                  example: "95"
                address:
                  type: string
                  example: "123 Main St"
                city:
                  type: string
                  example: "New York"
                state:
                  type: string
                  example: "NY"
                postal_code:
                  type: string
                  example: "10001"
                patient_image:
                  type: string
                  format: binary
                  description: Patient profile photo upload file
      responses:
        '200':
          description: Profile updated successfully
        '400':
          description: Invalid input parameters
        '401':
          description: Unauthorized
  /api/patient-symptoms:
    get:
      summary: List Active Symptoms
      description: Retrieve list of all active symptoms in the system.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Symptoms retrieved successfully
        '401':
          description: Unauthorized
  /api/patient-symptoms/selected:
    get:
      summary: Get Selected Patient Symptoms
      description: Retrieve the symptoms currently selected by the authenticated patient.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Selected symptoms retrieved successfully
        '401':
          description: Unauthorized
  /api/patient-symptoms/add:
    post:
      summary: Add Patient Symptoms
      description: Add new symptoms to the patient's list without removing existing ones.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                symptom_ids:
                  type: array
                  items:
                    type: integer
                  example: [1, 2]
                patient_other_symptoms:
                  type: string
                  example: "Mild fever and coughing"
      responses:
        '200':
          description: Symptoms added successfully
        '401':
          description: Unauthorized
        '422':
          description: Validation error
  /api/patient-symptoms/sync:
    post:
      summary: Sync Patient Symptoms
      description: Replace and synchronize patient symptoms.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                symptom_ids:
                  type: array
                  items:
                    type: integer
                  example: [3, 4]
                patient_other_symptoms:
                  type: string
                  example: "Headache"
      responses:
        '200':
          description: Symptoms saved successfully
        '401':
          description: Unauthorized
        '422':
          description: Validation error
  /api/patient-logout:
    post:
      summary: Patient Logout
      description: Log out the currently authenticated patient.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out successfully
        '401':
          description: Unauthorized
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
