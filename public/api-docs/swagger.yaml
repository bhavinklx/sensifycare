openapi: 3.0.0
info:
  title: Patient API
  version: 1.0.0
  description: API for patient operations
servers:
  - url: http://localhost
    description: Local server
  - url: https://www.sensifycare.com
    description: Production server
paths:
  /api/patient-signup:
    post:
      summary: Register a new patient
      description: Create a new patient record by providing name, email, mobile, and date of birth.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - mobile
                - dob
              properties:
                name:
                  type: string
                  example: "John Doe"
                email:
                  type: string
                  format: email
                  example: "john.doe@example.com"
                mobile:
                  type: string
                  example: "9876543210"
                dob:
                  type: string
                  format: date
                  example: "1990-05-15"
      responses:
        '200':
          description: Patient successfully registered
        '400':
          description: Invalid input parameters
  /api/patient-verify-otp:
    post:
      summary: Verify Patient OTP
      description: Verify the OTP sent to the patient's phone number.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - patient_phone
                - otp
              properties:
                patient_phone:
                  type: string
                  example: "9173905270"
                otp:
                  type: string
                  example: "729037"
      responses:
        '200':
          description: OTP verified successfully
        '400':
          description: Invalid OTP or input parameters
  /api/patient-send-otp:
    post:
      summary: Send Patient OTP
      description: Request an OTP to be sent to the patient's phone number.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - patient_phone
              properties:
                patient_phone:
                  type: string
                  example: "9173905270"
      responses:
        '200':
          description: OTP sent successfully
        '400':
          description: Invalid input parameters
  /api/patient-profile:
    get:
      summary: Get Patient Profile
      description: Retrieve the profile information for the authenticated patient.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful response
        '401':
          description: Unauthorized
  /api/patient-logout:
    post:
      summary: Patient Logout
      description: Log out the currently authenticated patient.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out successfully
        '401':
          description: Unauthorized
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
