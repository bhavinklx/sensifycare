openapi: 3.0.0
info:
  title: Sensify Care API
  version: 1.0.0
  description: API for sensify care operations
servers:
  - url: http://localhost
    description: Local server
  - url: https://www.sensifycare.com
    description: Production server
paths:
  /api/patient-signup:
    post:
      summary: Register a new patient
      description: Create a new patient record by providing name, email, phone, and date of birth.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - patient_name
                - email
                - patient_phone
                - date_of_birth
              properties:
                patient_name:
                  type: string
                  example: "Rahul Sharma"
                email:
                  type: string
                  format: email
                  example: "rahul@email.com"
                patient_phone:
                  type: string
                  example: "9876543210"
                date_of_birth:
                  type: string
                  format: date
                  example: "1992-05-14"
      responses:
        '200':
          description: Patient successfully registered
        '400':
          description: Invalid input parameters
  /api/patient-verify-otp:
    post:
      summary: Verify Patient OTP
      description: Verify the OTP sent to the patient's phone number.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - patient_phone
                - otp
              properties:
                patient_phone:
                  type: string
                  example: "9173905270"
                otp:
                  type: string
                  example: "729037"
      responses:
        '200':
          description: OTP verified successfully
        '400':
          description: Invalid OTP or input parameters
  /api/patient-send-otp:
    post:
      summary: Send Patient OTP
      description: Request an OTP to be sent to the patient's phone number.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - patient_phone
              properties:
                patient_phone:
                  type: string
                  example: "9173905270"
      responses:
        '200':
          description: OTP sent successfully
        '400':
          description: Invalid input parameters
  /api/patient-profile:
    get:
      summary: Get Patient Profile
      description: Retrieve the profile information for the authenticated patient.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful response
        '401':
          description: Unauthorized
  /api/patient-profile/update:
    post:
      summary: Update Patient Profile
      description: Update profile details for the authenticated patient based on the step. One API handles basic, health, symptoms, and edit steps.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - profile_step
              properties:
                profile_step:
                  type: string
                  enum: [basic, health, symptoms, edit]
                  example: "basic"
                first_name:
                  type: string
                  example: "Rahul"
                last_name:
                  type: string
                  example: "Sharma"
                dob:
                  type: string
                  format: date
                  example: "1992-05-14"
                gender:
                  type: string
                  enum: [Male, Female, Other]
                  example: "Male"
                height_cm:
                  type: integer
                  example: 175
                weight_kg:
                  type: integer
                  example: 72
                city:
                  type: string
                  example: "Ahmedabad"
                preferred_language:
                  type: string
                  enum: [English, Hindi, Gujarati, Marathi, Tamil]
                  example: "English"
                average_sleep:
                  type: string
                  example: "6 - 7 hours"
                physical_activity:
                  type: string
                  example: "3 - 4 days / week"
                smoking:
                  type: string
                  example: "Never"
                alcohol:
                  type: string
                  example: "Never"
                water_intake:
                  type: string
                  example: "1.5 - 2 L"
                diet_type:
                  type: string
                  example: "Vegetarian"
                stress_level:
                  type: string
                  example: "Moderate"
                fasting:
                  type: string
                  example: "Occasionally"
                work_type:
                  type: string
                  example: "Regular (Day)"
                menstrual_cycle:
                  type: string
                  example: "Not Applicable"
                symptoms:
                  type: string
                  description: JSON string array of symptom IDs
                  example: '["fatigue","headache"]'
                other_symptoms:
                  type: string
                  example: "Neck pain"
                patient_image:
                  type: string
                  format: binary
                  description: Patient profile photo upload file
      responses:
        '200':
          description: Profile updated successfully
        '400':
          description: Invalid input parameters
        '401':
          description: Unauthorized
  /api/patient-logout:
    post:
      summary: Patient Logout
      description: Log out the currently authenticated patient.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out successfully
        '401':
          description: Unauthorized
  /api/articles:
    get:
      summary: Get Articles List
      description: Retrieve a list of all active articles/blogs.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Articles fetched successfully"
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        article_id:
                          type: integer
                          example: 1
                        title:
                          type: string
                          example: "How to maintain a healthy lifestyle"
                        slug:
                          type: string
                          example: "how-to-maintain-a-healthy-lifestyle"
                        date:
                          type: string
                          example: "2026-07-31"
                        image_url:
                          type: string
                          example: "http://domain.com/uploads/blog/image.jpg"
                        short_description:
                          type: string
                          example: "Tips and tricks for healthy habits."
                        created_at:
                          type: string
                          example: "2026-07-31 09:56:55"
        '401':
          description: Unauthorized
  /api/articles/{id}:
    get:
      summary: Get Article Details
      description: Retrieve details of a single active article by its ID.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the article (blog_id)
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Article details fetched successfully"
                  data:
                    type: object
                    properties:
                      article_id:
                        type: integer
                        example: 1
                      title:
                        type: string
                        example: "How to maintain a healthy lifestyle"
                      slug:
                        type: string
                        example: "how-to-maintain-a-healthy-lifestyle"
                      date:
                        type: string
                        example: "2026-07-31"
                      image_url:
                        type: string
                        example: "http://domain.com/uploads/blog/image.jpg"
                      short_description:
                        type: string
                        example: "Tips and tricks for healthy habits."
                      description:
                        type: string
                        example: "<p>Full details here...</p>"
                      created_at:
                        type: string
                        example: "2026-07-31 09:56:55"
        '401':
          description: Unauthorized
        '404':
          description: Article not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
