openapi: 3.0.0
info:
  title: Sensify Care API
  version: 1.0.0
  description: API for sensify care operations
servers:
  - url: http://localhost
    description: Local server
  - url: https://www.sensifycare.com
    description: Production server
paths:
  /api/patient-signup:
    post:
      summary: Register a new patient
      description: Create a new patient record by providing name, email, phone, and date of birth.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - patient_name
                - email
                - patient_phone
                - date_of_birth
              properties:
                patient_name:
                  type: string
                  example: "Rahul Sharma"
                email:
                  type: string
                  format: email
                  example: "rahul@email.com"
                patient_phone:
                  type: string
                  example: "9876543210"
                date_of_birth:
                  type: string
                  format: date
                  example: "1992-05-14"
      responses:
        '200':
          description: Patient successfully registered
        '400':
          description: Invalid input parameters
  /api/patient-verify-otp:
    post:
      summary: Verify Patient OTP
      description: Verify the OTP sent to the patient's phone number.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - patient_phone
                - otp
              properties:
                patient_phone:
                  type: string
                  example: "9173905270"
                otp:
                  type: string
                  example: "729037"
      responses:
        '200':
          description: OTP verified successfully
        '400':
          description: Invalid OTP or input parameters
  /api/patient-send-otp:
    post:
      summary: Send Patient OTP
      description: Request an OTP to be sent to the patient's phone number.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - patient_phone
              properties:
                patient_phone:
                  type: string
                  example: "9173905270"
      responses:
        '200':
          description: OTP sent successfully
        '400':
          description: Invalid input parameters
  /api/patient-profile:
    get:
      summary: Get Patient Profile
      description: Retrieve the profile information for the authenticated patient.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful response
        '401':
          description: Unauthorized
  /api/patient-profile/update:
    post:
      summary: Update Patient Profile
      description: Update profile details for the authenticated patient based on the step. One API handles basic, health, symptoms, and edit steps.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - profile_step
              properties:
                profile_step:
                  type: string
                  enum: [basic, health, symptoms, edit]
                  example: "basic"
                first_name:
                  type: string
                  example: "Rahul"
                last_name:
                  type: string
                  example: "Sharma"
                dob:
                  type: string
                  format: date
                  example: "1992-05-14"
                gender:
                  type: string
                  enum: [Male, Female, Other]
                  example: "Male"
                height_cm:
                  type: integer
                  example: 175
                weight_kg:
                  type: integer
                  example: 72
                city:
                  type: string
                  example: "Ahmedabad"
                preferred_language:
                  type: string
                  enum: [English, Hindi, Gujarati, Marathi, Tamil]
                  example: "English"
                average_sleep:
                  type: string
                  example: "6 - 7 hours"
                physical_activity:
                  type: string
                  example: "3 - 4 days / week"
                smoking:
                  type: string
                  example: "Never"
                alcohol:
                  type: string
                  example: "Never"
                water_intake:
                  type: string
                  example: "1.5 - 2 L"
                diet_type:
                  type: string
                  example: "Vegetarian"
                stress_level:
                  type: string
                  example: "Moderate"
                fasting:
                  type: string
                  example: "Occasionally"
                work_type:
                  type: string
                  example: "Regular (Day)"
                menstrual_cycle:
                  type: string
                  example: "Not Applicable"
                symptoms:
                  type: string
                  description: JSON string array of symptom IDs
                  example: '["fatigue","headache"]'
                other_symptoms:
                  type: string
                  example: "Neck pain"
                patient_image:
                  type: string
                  format: binary
                  description: Patient profile photo upload file
      responses:
        '200':
          description: Profile updated successfully
        '400':
          description: Invalid input parameters
        '401':
          description: Unauthorized
  /api/patient-logout:
    post:
      summary: Patient Logout
      description: Log out the currently authenticated patient.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out successfully
        '401':
          description: Unauthorized
  /api/articles:
    get:
      summary: Get Articles List
      description: Retrieve a list of all active articles/blogs.
      security:
        - bearerAuth: []
      parameters:
        - name: category
          in: query
          description: Filter articles by category slug (e.g. nutrition, lab-tests). Use 'all' or omit to retrieve all.
          required: false
          schema:
            type: string
            example: "nutrition"
        - name: page
          in: query
          description: Page number for pagination
          required: false
          schema:
            type: integer
            example: 1
        - name: per_page
          in: query
          description: Number of articles per page
          required: false
          schema:
            type: integer
            example: 10
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Articles fetched successfully"
                  data:
                    type: object
                    properties:
                      categories:
                        type: array
                        items:
                          type: object
                          properties:
                            category_id:
                              type: integer
                              example: 8
                            title:
                              type: string
                              example: "Nutrition"
                            slug:
                              type: string
                              example: "nutrition"
                      featured_article:
                        type: object
                        nullable: true
                        properties:
                          article_id:
                            type: integer
                            example: 1
                          title:
                            type: string
                            example: "What Your CBC Report Actually Tells You"
                          slug:
                            type: string
                            example: "what-your-cbc-report-actually-tells-you"
                          date:
                            type: string
                            example: "2026-07-31"
                          image_url:
                            type: string
                            example: "http://domain.com/uploads/blog/image.jpg"
                          short_description:
                            type: string
                            example: "Haemoglobin, WBC, platelets — understand every column..."
                          category_name:
                            type: string
                            example: "Lab Tests"
                          read_time:
                            type: string
                            example: "4 min read"
                          created_at:
                            type: string
                            example: "2026-07-31 09:56:55"
                      articles:
                        type: array
                        items:
                          type: object
                          properties:
                            article_id:
                              type: integer
                              example: 1
                            title:
                              type: string
                              example: "How to maintain a healthy lifestyle"
                            slug:
                              type: string
                              example: "how-to-maintain-a-healthy-lifestyle"
                            date:
                              type: string
                              example: "2026-07-31"
                            image_url:
                              type: string
                              example: "http://domain.com/uploads/blog/image.jpg"
                            short_description:
                              type: string
                              example: "Tips and tricks for healthy habits."
                            category_name:
                              type: string
                              example: "Nutrition"
                            label:
                              type: string
                              example: "Essential Read"
                            read_time:
                              type: string
                              example: "4 min"
                            created_at:
                              type: string
                              example: "2026-07-31 09:56:55"
                      pagination:
                        type: object
                        properties:
                          current_page:
                            type: integer
                            example: 1
                          last_page:
                            type: integer
                            example: 3
                          per_page:
                            type: integer
                            example: 10
                          total:
                            type: integer
                            example: 30
        '401':
          description: Unauthorized
  /api/articles/{id}:
    get:
      summary: Get Article Details
      description: Retrieve details of a single active article by its ID.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the article (blog_id)
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Article details fetched successfully"
                  data:
                    type: object
                    properties:
                      article_id:
                        type: integer
                        example: 1
                      title:
                        type: string
                        example: "How to maintain a healthy lifestyle"
                      slug:
                        type: string
                        example: "how-to-maintain-a-healthy-lifestyle"
                      date:
                        type: string
                        example: "2026-07-31"
                      image_url:
                        type: string
                        example: "http://domain.com/uploads/blog/image.jpg"
                      short_description:
                        type: string
                        example: "Tips and tricks for healthy habits."
                      description:
                        type: string
                        example: "<p>Full details here...</p>"
                      category_name:
                        type: string
                        example: "Nutrition"
                      author:
                        type: string
                        example: "SensifyCare Health Team"
                      read_time:
                        type: string
                        example: "4 min read"
                      label:
                        type: string
                        example: "Essential Read"
                      created_at:
                        type: string
                        example: "2026-07-31 09:56:55"
        '401':
          description: Unauthorized
        '404':
          description: Article not found
  /api/patient-reports:
    get:
      summary: Get Patient Reports List
      description: Retrieve all reports uploaded by the authenticated patient along with aggregated statistics for the "My Reports" screen.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Reports list fetched successfully"
                  data:
                    type: object
                    properties:
                      stats:
                        type: object
                        properties:
                          total_reports:
                            type: integer
                            example: 5
                          total_abnormal:
                            type: integer
                            example: 9
                          total_markers_ok:
                            type: integer
                            example: 87
                      reports:
                        type: array
                        items:
                          type: object
                          properties:
                            patient_report_id:
                              type: integer
                              example: 1
                            patient_id:
                              type: integer
                              example: 1
                            file_name:
                              type: string
                              example: "blood_report.pdf"
                            file_path:
                              type: string
                              example: "http://localhost/uploads/report/REP-1722868841_blood_report.pdf"
                            file_size:
                              type: integer
                              example: 2516582
                            status:
                              type: string
                              example: "Processed"
                            ocr_data:
                              type: object
                              nullable: true
                              example:
                                blood_group: "O+"
                                hemoglobin: "14.5 g/dL"
                            formatted_file_size:
                              type: string
                              example: "2.4 MB"
                            formatted_upload_date:
                              type: string
                              example: "Aug 05, 2026"
                            report_title:
                              type: string
                              example: "Max Healthcare – Blood Report"
                            score:
                              type: integer
                              example: 82
                            markers_count:
                              type: integer
                              example: 28
                            abnormal_count:
                              type: integer
                              example: 2
                            ok_count:
                              type: integer
                              example: 26
                            pages_count:
                              type: integer
                              example: 12
                            report_quality:
                              type: string
                              example: "good"
        '401':
          description: Unauthorized
  /api/patient-reports/upload:
    post:
      summary: Upload Patient Report
      description: Upload a medical report file (jpg, jpeg, png, pdf, xlsx, xls). Maximum file size is 20MB.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: The report file to upload
      responses:
        '201':
          description: Report uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Report uploaded and processed successfully"
                  data:
                    type: object
                    properties:
                      patient_report_id:
                        type: integer
                        example: 1
                      patient_id:
                        type: integer
                        example: 1
                      file_name:
                        type: string
                        example: "blood_report.pdf"
                      file_path:
                        type: string
                        example: "http://localhost/uploads/report/REP-1722868841_blood_report.pdf"
                      file_size:
                        type: integer
                        example: 2516582
                      status:
                        type: string
                        example: "Processed"
                      ocr_data:
                        type: object
                        nullable: true
                        description: OCR extracted data from the report file
                        example:
                          blood_group: "O+"
                          hemoglobin: "14.5 g/dL"
                      formatted_file_size:
                        type: string
                        example: "2.4 MB"
                      formatted_upload_date:
                        type: string
                        example: "Aug 05, 2026"
                      report_title:
                        type: string
                        example: "Max Healthcare – Blood Report"
                      score:
                        type: integer
                        example: 82
                      markers_count:
                        type: integer
                        example: 28
                      abnormal_count:
                        type: integer
                        example: 2
                      ok_count:
                        type: integer
                        example: 26
                      pages_count:
                        type: integer
                        example: 12
                      report_quality:
                        type: string
                        example: "good"
        '400':
          description: File upload failed
        '401':
          description: Unauthorized
        '422':
          description: Validation error
  /api/patient-reports/recent:
    get:
      summary: Get Patient's Recent Report
      description: Retrieve the single most recent report uploaded by the authenticated patient.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Recent report fetched successfully"
                  data:
                    type: object
                    nullable: true
                    properties:
                      patient_report_id:
                        type: integer
                        example: 1
                      patient_id:
                        type: integer
                        example: 1
                      file_name:
                        type: string
                        example: "blood_report.pdf"
                      file_path:
                        type: string
                        example: "http://localhost/uploads/report/REP-1722868841_blood_report.pdf"
                      file_size:
                        type: integer
                        example: 2516582
                      status:
                        type: string
                        example: "Processed"
                      ocr_data:
                        type: object
                        nullable: true
                        description: OCR extracted data from the report file
                        example:
                          blood_group: "O+"
                          hemoglobin: "14.5 g/dL"
                      formatted_file_size:
                        type: string
                        example: "2.4 MB"
                      formatted_upload_date:
                        type: string
                        example: "Aug 05, 2026"
                      report_title:
                        type: string
                        example: "Max Healthcare – Blood Report"
                      score:
                        type: integer
                        example: 82
                      markers_count:
                        type: integer
                        example: 28
                      abnormal_count:
                        type: integer
                        example: 2
                      ok_count:
                        type: integer
                        example: 26
                      pages_count:
                        type: integer
                        example: 12
                      report_quality:
                        type: string
                        example: "good"
        '401':
          description: Unauthorized
  /api/patient-reports/analyze:
    post:
      summary: Analyze Patient Report
      description: Analyze a specific medical report or the most recent one using the Sensify Care AI Agent.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum: [file, text]
                  description: Optional type of analysis. Defaults to 'file' if patient_report_id or file_url is provided, otherwise 'text'.
                  example: "file"
                patient_report_id:
                  type: integer
                  description: Optional ID of the specific report to analyze (only used when type is 'file'). If not provided but type is 'file', the most recent report is used.
                  example: 1
                file_url:
                  type: string
                  description: Optional URL of the report file to analyze (alternative to patient_report_id when type is 'file').
                  example: "https://www.sensifycare.com/uploads/report/REP-1722868841_blood_report.pdf"
                question:
                  type: string
                  description: Optional question or query to ask the AI Agent.
                  example: "What does this mean?"
                text:
                  type: string
                  description: Alternative key to pass the question/query (maps to question).
                  example: "Explain the hemoglobin levels."
                language:
                  type: string
                  description: Optional language code for the analysis output (defaults to the patient's preferred language or 'en').
                  example: "en"
      responses:
        '200':
          description: Report analyzed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Report analyzed successfully"
                  data:
                    type: object
                    description: The AI analysis result object from the agent
                    example:
                      status: "success"
                      analysis: "Based on the uploaded report, your hemoglobin is normal..."
        '401':
          description: Unauthorized
        '404':
          description: Report not found
        '422':
          description: Validation error
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
